[project]
name = "mnemos-workbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2,<3", "pandas>=2.2", "PyYAML>=6", "requests>=2.32", "tokenizers>=0.21"]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
