[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "constraint-memory-lab"
version = "0.1.0"
description = "Causal constraint and decision memory for matched MemoryArena experiments"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "pandas>=2.2", "numpy>=2.0", "requests>=2.32", "tokenizers>=0.21", "tqdm>=4.66"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
reports = ["pyarrow>=18", "matplotlib>=3.9"]

[project.scripts]
constraint-memory = "constraint_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
